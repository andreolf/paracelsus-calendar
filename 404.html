<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your Schedule · Paracelsus Recovery</title>
<script>
// GitHub Pages serves this for any unknown path. Short client links look like /<name>-<initials>
// (e.g. /anna-abc); hand them to the schedule page, which puts the pretty URL back in the address bar.
(function(){
  var p = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, '').toLowerCase();
  location.replace('/' + (/^[a-z0-9]+(-[a-z0-9]+)*-[a-z0-9._]+$/.test(p) ? '?s=' + encodeURIComponent(p) : '') + location.hash);
})();
</script>
</head>
<body style="background:#FAF6EE"></body>
</html>
